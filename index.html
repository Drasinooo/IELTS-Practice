<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IELTS Precision Architect v13.0</title>
    <style>
        :root { --ielts-blue: #004f9a; --correct: #d4edda; --wrong: #f8d7da; --text: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #f4f7f9; color: var(--text); }
        
        .header { background: #333; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--ielts-blue); }
        .tab-bar { background: #e0e0e0; padding: 5px 25px; display: flex; gap: 8px; border-bottom: 1px solid #ccc; }
        .tab-btn { padding: 10px 25px; cursor: pointer; border: none; background: #d0d0d0; font-weight: bold; color: #555; border-radius: 4px 4px 0 0; transition: 0.2s; }
        .tab-btn.active { background: white; color: var(--ielts-blue); border: 1px solid #ccc; border-bottom: none; }

        .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
        .view.active { display: flex; }

        /* SETUP VIEW */
        #input-view { padding: 30px; gap: 20px; overflow-y: auto; background: white; margin: 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .input-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        textarea { width: 100%; min-height: 120px; padding: 12px; border: 1.5px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 14px; resize: vertical; }
        .build-btn { padding: 18px 50px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; align-self: flex-start; }

        /* PRACTICE INTERFACE */
        .passage-nav { background: #fff; padding: 10px 40px; display: flex; gap: 15px; border-bottom: 1px solid #ddd; }
        .p-nav-btn { padding: 8px 20px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 20px; font-weight: bold; transition: 0.2s; }
        .p-nav-btn.active { background: var(--ielts-blue); color: white; border-color: var(--ielts-blue); }

        .main-area { display: flex; flex: 1; overflow: hidden; }
        .pass-side { flex: 1; padding: 45px; overflow-y: auto; background: white; border-right: 2px solid #ddd; line-height: 1.9; font-size: 18.5px; }
        .ques-side { flex: 1; padding: 45px; overflow-y: auto; background: #fdfdfd; position: relative; }
        
        .p-title { font-size: 1.4em; font-weight: 800; color: #000; margin-bottom: 5px; }
        .p-subtitle { font-size: 1.1em; font-weight: 600; color: #444; margin-bottom: 25px; display: block; }
        
        .instr-box { margin-top: 35px; color: #333; border-left: 6px solid var(--ielts-blue); padding: 18px; background: #f8f9fa; font-weight: 700; border-radius: 0 6px 6px 0; }
        .q-card { margin-bottom: 30px; padding: 25px; border: 1px solid #e0e0e0; border-radius: 10px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .mcq-opt { display: block; margin-left: 25px; margin-top: 10px; color: #444; font-size: 16.5px; }
        .ielts-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; margin-top: 15px; font-size: 17px; box-sizing: border-box; }
        .ielts-input:focus { border-color: var(--ielts-blue); outline: none; background: #f0f7ff; }

        .fb-text { font-size: 15px; font-weight: bold; margin-top: 12px; display: block; }
        .correct { border-color: #28a745 !important; background-color: #f0fff4; }
        .wrong { border-color: #dc3545 !important; background-color: #fff5f5; }
        
        .check-btn { position: sticky; bottom: 0; width: 100%; padding: 22px; background: var(--ielts-blue); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 1.2em; }
        .timer { font-size: 24px; color: #ffdb58; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold;">IELTS Precision Architect v13.0</div>
        <div class="timer" id="timer">60:00</div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('input')">1. Setup Content</button>
        <button class="tab-btn" onclick="switchTab('practice')">2. Live Practice</button>
    </div>

    <div id="input-view" class="view active">
        <div class="input-box">
            <label><b>Box 1: All Reading Passages</b> (Use <i>Reading Passage [1-3]: [Title]</i> as separators)</label>
            <textarea id="bulk-pass" placeholder="Paste full articles here..."></textarea>
        </div>
        <div class="input-box">
            <label><b>Box 2: All Questions</b> (System splits by 'Passage 1/2/3' or jump in numbering)</label>
            <textarea id="bulk-ques" placeholder="Paste all questions here..."></textarea>
        </div>
        <div class="input-box">
            <label><b>Box 3: All Answer Keys</b> (Paste the full numbered list here)</label>
            <textarea id="bulk-ans" placeholder="Paste full numbered Answer Key here..."></textarea>
        </div>
        <button class="build-btn" onclick="processBulk()">Construct Test</button>
    </div>

    <div id="practice-view" class="view">
        <div class="passage-nav">
            <button class="p-nav-btn active" onclick="changePassage(0)">Reading Passage 1</button>
            <button class="p-nav-btn" onclick="changePassage(1)">Reading Passage 2</button>
            <button class="p-nav-btn" onclick="changePassage(2)">Reading Passage 3</button>
        </div>
        <div class="main-area">
            <div class="pass-side" id="out-pass"></div>
            <div class="ques-side">
                <div id="out-ques"></div>
                <button class="check-btn" onclick="checkAll()">Verify My Answers</button>
            </div>
        </div>
    </div>

    <script>
        let currentP = 0;
        let activeData = [];

        function switchTab(t) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(t === 'input') {
                document.getElementById('input-view').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                renderUI();
                document.getElementById('practice-view').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        function processBulk() {
            const rawP = document.getElementById('bulk-pass').value;
            const rawQ = document.getElementById('bulk-ques').value;
            const rawA = document.getElementById('bulk-ans').value;

            // 1. Passage Splitting Logic
            const pParts = rawP.split(/Reading Passage\s+([123]):\s*/i);
            const passages = [];
            for (let i = 1; i < pParts.length; i += 2) {
                passages.push(pParts[i+1].trim());
            }

            // 2. Question Splitting Logic (Anchor points: Passage 1/2/3 markers)
            const qParts = rawQ.split(/Questions?\s+\d+[-–]\d+\s*\(?Passage\s+[123]\)?/i).filter(s => s.trim().length > 10);

            // 3. Answer Key Map
            const ansMap = {};
            rawA.split('\n').forEach(l => {
                const m = l.match(/(\d+)\.\s*(.*)/);
                if (m) ansMap[m[1]] = m[2].trim();
            });

            activeData = passages.map((p, idx) => ({
                content: p,
                questions: qParts[idx] || "",
                answers: ansMap
            }));

            localStorage.setItem('ielts_architect_v13', JSON.stringify(activeData));
            alert("Blueprint Loaded! " + passages.length + " Passages ready.");
        }

        function changePassage(idx) {
            currentP = idx;
            document.querySelectorAll('.p-nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            renderUI();
        }

        function renderUI() {
            const d = activeData[currentP];
            if(!d) return;

            // Passage Rendering with Title/Subtitle bolding
            const pLines = d.content.split('\n').filter(l => l.trim());
            document.getElementById('out-pass').innerHTML = pLines.map((l, i) => {
                if(i === 0) return `<div class="p-title">${l}</div>`;
                if(i === 1) return `<div class="p-subtitle">${l}</div>`;
                return `<p>${l}</p>`;
            }).join('');
            
            let html = '';
            const qLines = d.questions.split('\n');

            qLines.forEach(line => {
                line = line.trim();
                // BULLET POINT FIX: Support ●, •, *, -
                line = line.replace(/^[●•*-]\s*/, '');
                if(!line || line.match(/^_{3,}$/)) return;

                const keywords = ["Questions", "boxes", "write:", "agree", "Choose", "TRUE", "FALSE", "NOT GIVEN", "YES", "NO"];
                const allNum = [...line.matchAll(/(\d+)\./g)];

                if (keywords.some(k => line.includes(k)) && allNum.length === 0) {
                    html += `<div class="instr-box">${line}</div>`;
                } else if (allNum.length > 0) {
                    allNum.forEach(m => {
                        const qNum = m[1];
                        // CONTEXT FIX: Replace only the current question's number with a placeholder
                        const regex = new RegExp(`\\b${qNum}\\.\\s*(_*)`, 'g');
                        let cleanText = line.replace(regex, ' (____) ');
                        
                        const parts = cleanText.split(/\s*([A-D]\.\s+)/);
                        let stem = parts[0];
                        let opts = '';
                        for (let j = 1; j < parts.length; j += 2) {
                            opts += `<span class="mcq-opt"><strong>${parts[j]}</strong>${parts[j+1]}</span>`;
                        }

                        html += `
                            <div class="q-card" id="q-${qNum}">
                                <p><strong>${qNum}.</strong> ${stem}</p>
                                ${opts}
                                <input type="text" class="ielts-input" data-qn="${qNum}" placeholder="Enter answer for ${qNum}...">
                                <div class="fb-text" id="fb-${qNum}"></div>
                            </div>`;
                    });
                } else {
                    html += `<p style="padding: 5px 20px; color: #555;">${line}</p>`;
                }
            });
            document.getElementById('out-ques').innerHTML = html;
        }

        function checkAll() {
    const inputs = document.querySelectorAll('.ielts-input');
    const map = activeData[currentP].answers;

    inputs.forEach(input => {
        const n = input.getAttribute('data-qn');
        const user = input.value.trim().toLowerCase();
        const full = map[n] || "";
        
        // NEW LOGIC: Remove the number (e.g., "26. ") but keep the rest of the words intact
        const clean = full.replace(/^\d+[.)\s]*/, '').trim();
        
        // Remove parenthetical notes if they exist, but keep multiple words
        const core = clean.split(/\s\(/)[0].toLowerCase();

        const card = document.getElementById(`q-${n}`);
        const fb = document.getElementById(`fb-${n}`);

        if(user === core) {
            card.className = "q-card correct";
            fb.innerHTML = `✅ Correct: <b>${clean}</b>`;
            fb.style.color = "#155724";
        } else {
            card.className = "q-card wrong";
            fb.innerHTML = `❌ Incorrect. Correct: <b>${clean}</b>`;
            fb.style.color = "#721c24";
        }
    });
}

        let timer = 3600;
        setInterval(() => {
            let m = Math.floor(timer / 60); let s = timer % 60;
            const el = document.getElementById('timer');
            if(el) el.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timer > 0) timer--;
        }, 1000);

        window.onload = () => {
            const saved = localStorage.getItem('ielts_architect_v13');
            if(saved) activeData = JSON.parse(saved);
        };
    </script>
</body>
</html>
