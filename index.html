<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal IELTS Practice System</title>
    <style>
.ielts-input:focus {
    outline: none;
    border: 2px solid #004f9a !important; /* The official IELTS blue focus color */
    background-color: #f0f7ff;
}
        :root { --ielts-blue: #004f9a; --ielts-grey: #f4f4f4; --ielts-yellow: #fff3cd; }
        body { font-family: 'Arial', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* HEADER & TABS */
        .header { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .tab-bar { background: #eee; padding: 5px 20px; border-bottom: 1px solid #ccc; }
        .tab-btn { padding: 8px 15px; cursor: pointer; border: none; background: #ddd; margin-right: 5px; }
        .tab-btn.active { background: var(--ielts-blue); color: white; }

        /* VIEW MODES */
        .view { display: none; flex: 1; overflow: hidden; }
        .view.active { display: flex; }

        /* CREATOR MODE (INPUT) */
        #creator-view { flex-direction: column; padding: 40px; gap: 20px; overflow-y: auto; background: #fafafa; }
        textarea { width: 100%; min-height: 200px; padding: 15px; border: 1px solid #ccc; font-family: inherit; }
        .save-btn { padding: 15px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; align-self: flex-start; }

        /* TEST MODE (UI) */
        .passage-side { flex: 1; padding: 40px; overflow-y: auto; background: white; border-right: 2px solid #ccc; line-height: 1.8; font-size: 18px; }
        .question-side { flex: 1; padding: 40px; overflow-y: auto; background: white; }
        .q-item { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }

        .timer { font-size: 22px; color: #ffdb58; font-weight: bold; }
        ::selection { background: var(--ielts-yellow); }
    </style>
</head>
<body>

    <div class="header">
        <div id="display-title">IELTS Practice System</div>
        <div class="timer" id="timer">60:00</div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('creator')">1. Setup Content</button>
        <button class="tab-btn" onclick="switchTab('test')">2. Start Practice</button>
    </div>

    <div id="creator-view" class="view active">
        <h2>Load Your Test Content</h2>
        <label><b>Test Title:</b></label>
        <input type="text" id="input-title" placeholder="e.g. Cambridge 18 - Test 1" style="padding: 10px;">
        
        <label><b>Paste Passage (HTML allowed):</b></label>
        <textarea id="input-passage" placeholder="Paste the long article text here..."></textarea>
        
        <label><b>Paste Questions (One per line):</b></label>
        <textarea id="input-questions" placeholder="Question 1: What is...?&#10;Question 2: Who was...?"></textarea>
        
        <button class="save-btn" onclick="saveData()">Save & Update System</button>
        <p style="color: #666;"><i>Note: This saves to your browser. You can refresh and it will stay here.</i></p>
    </div>

    <div id="test-view" class="view">
        <div class="passage-side" id="display-passage"></div>
        <div class="question-side" id="display-questions"></div>
    </div>

    <script>
        // --- LOGIC: SAVING ---
function saveData() {
    const data = {
        title: document.getElementById('input-title').value,
        passage: document.getElementById('input-passage').value,
        questions: document.getElementById('input-questions').value
    };
    localStorage.setItem('myIeltsTest', JSON.stringify(data));
    alert("System updated!");
}

// --- LOGIC: SMART LOADING ---
function loadTest() {
    const saved = localStorage.getItem('myIeltsTest');
    if(!saved) return;
    const data = JSON.parse(saved);

    document.getElementById('display-title').innerText = data.title;
    
    // Format the passage: Add spaces between paragraphs automatically
    document.getElementById('display-passage').innerHTML = data.passage
        .split('\n')
        .map(para => para.trim() ? `<p>${para}</p>` : '')
        .join('');
    
    let qHtml = '';
    const lines = data.questions.split('\n');

    lines.forEach((line) => {
        line = line.trim();
        if (!line) return;

        // SMART RECOGNITION:
        // If a line starts with a number followed by a dot (e.g., "1. "), treat it as a question.
        const questionMatch = line.match(/^(\d+)\.\s*(.*)/);

        if (questionMatch) {
            const qNum = questionMatch[1];
            const qText = questionMatch[2];
            qHtml += `
                <div class="q-item" style="margin-bottom: 20px;">
                    <p><strong>${qNum}.</strong> ${qText}</p>
                    <input type="text" class="ielts-input" placeholder="Enter answer..." 
                           style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                </div>`;
        } else {
            // Otherwise, treat it as an instruction heading (Bold, no input box)
            qHtml += `<h4 style="margin-top: 30px; color: #444; border-bottom: 1px solid #eee; padding-bottom: 5px;">${line}</h4>`;
        }
    });

    document.getElementById('display-questions').innerHTML = qHtml;
}
    </script>
</body>
</html>
